[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sudarshan-ai-detector"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "fastapi",
    "pydantic",
    "uvicorn",
    "langdetect",
    "pyyaml",
    "python-dotenv"
]

[tool.setuptools]
packages = ["scripts"]

[tool.setuptools.package-data]
"*" = ["*"]
